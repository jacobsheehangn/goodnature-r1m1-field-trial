name: R1M1 release gate

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: Run the optional deployed Render smoke test
        required: false
        default: false
        type: boolean

jobs:
  release-gate:
    name: Required release gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          playwright install --with-deps chromium

      - name: Static and workbook checks
        run: python tests/release_gate.py

      - name: Deterministic local browser tests
        run: pytest tests/test_local_app.py

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1m1-local-test-screenshots
          path: tests/screenshots
          if-no-files-found: ignore

  deployed-smoke:
    name: Optional deployed app smoke test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_smoke }}
    needs: release-gate
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          playwright install --with-deps chromium

      - name: Run optional deployed app smoke test
        env:
          R1M1_TEST_URL: ${{ secrets.R1M1_TEST_URL }}
          R1M1_TEST_PASSWORD: ${{ secrets.R1M1_TEST_PASSWORD }}
        run: pytest tests/test_live_smoke.py
