[theme]
base = "light"
primaryColor = "#F36C21"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F5"
textColor = "#25262D"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
# Serves ./static at /app/static (fonts, icons). Public and unauthenticated: only publishable files go there.
enableStaticServing = true
